# Local PostgreSQL and RustFS for kernel tests and the local runbook.
# Not a production or deployment definition.
services:
  rustfs:
    profiles: [compute]
    image: rustfs/rustfs:1.0.0@sha256:ba0a1b53e36f321c0d46f3867104abef169f7bc59c467c664ddac87e7ddc9a8b
    ports:
      - "127.0.0.1:55440:9000"
      - "127.0.0.1:55441:9001"
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    environment:
      RUSTFS_ADDRESS: "0.0.0.0:9000"
      RUSTFS_CONSOLE_ADDRESS: "0.0.0.0:9001"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: orbit-local-test
      RUSTFS_SECRET_KEY: orbit-local-test-secret
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://127.0.0.1:9000/health/ready || exit 1"]
      interval: 2s
      timeout: 5s
      retries: 15
    volumes:
      - orbit-rustfs:/data
  postgres:
    image: postgres:17-alpine
    container_name: orbit-postgres
    ports:
      - "127.0.0.1:55439:5432"
    environment:
      POSTGRES_USER: orbit
      POSTGRES_PASSWORD: orbit-local-test
      POSTGRES_DB: orbit
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U orbit -d orbit"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - orbit-postgres:/var/lib/postgresql/data

volumes:
  orbit-postgres:
  orbit-rustfs:
