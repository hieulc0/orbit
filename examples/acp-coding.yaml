apiVersion: orbit/v1
kind: Definition
metadata:
  name: acp-codex-repository-review
inputs:
  repository_id: approved-repository
  base_revision: REPLACE_WITH_FULL_COMMIT_ID
  task: Fix the bounded issue described here; preserve existing tests.
steps:
  code:
    uses: repository.code
    recovery_policy: restart_from_inputs
    max_attempts: 3
    timeout_seconds: 900
    retry_backoff_seconds: 5
    resources: {cpu_millis: 2000, memory_mib: 1024}
    execution: {isolation: trusted, network: none, filesystem: workspace}
    agent:
      identity: codex-coder
      binding: codex-acp-v1
      tools: [read_file, write_file, shell]
      permissions: [workspace.read, workspace.write, shell.execute]
      budget: {calls: 33}
      max_delegations: 0
      context: {}
      output: object
      acp_limits:
        prompt_turns: 1
        broker_calls: 32
        reported_tool_calls: 64
        turn_timeout_seconds: 600
        terminal_timeout_seconds: 30
        terminal_runtime_seconds: 600
        output_bytes: 1048576
  test:
    uses: repository.test
    needs: [code]
    recovery_policy: restart_from_inputs
    max_attempts: 2
    timeout_seconds: 600
    retry_backoff_seconds: 5
    resources: {cpu_millis: 1000, memory_mib: 512}
    execution: {isolation: trusted, network: none, filesystem: workspace}
    commands:
      - argv: [sh, test.sh]
        cwd: .
        timeout_seconds: 120
  review:
    uses: human.approval
    needs: [test]
    recovery_policy: restart_from_inputs
    max_attempts: 1
    timeout_seconds: 86400
    retry_backoff_seconds: 0
    approval:
      assignees: [operator]
      prompt: Review the accepted patch and independent test evidence.
