apiVersion: orbit/v1
kind: Definition
metadata:
  name: parallel-calculator-checks
inputs:
  repository_id: fixture
  base_revision: REPLACE_WITH_FULL_COMMIT_ID
  task: Fix calc.sh to add its two inputs. Preserve the existing tests.
steps:
  implement:
    uses: repository.code
    recovery_policy: restart_from_inputs
    max_attempts: 3
    timeout_seconds: 120
    retry_backoff_seconds: 1
  regression:
    uses: repository.test
    needs: [implement]
    recovery_policy: restart_from_inputs
    max_attempts: 2
    timeout_seconds: 60
    retry_backoff_seconds: 1
    commands:
      - argv: [sh, test.sh]
        cwd: .
        timeout_seconds: 10
  syntax:
    uses: repository.test
    needs: [implement]
    recovery_policy: restart_from_inputs
    max_attempts: 2
    timeout_seconds: 60
    retry_backoff_seconds: 1
    commands:
      - argv: [sh, -n, calc.sh]
        cwd: .
        timeout_seconds: 10
  verified:
    uses: engine.join
    needs: [regression, syntax]
    recovery_policy: restart_from_inputs
    max_attempts: 1
    timeout_seconds: 60
    retry_backoff_seconds: 0
